<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cafezim — peças para o seu cantinho do café</title>
<meta name="description" content="Bandejas, suportes, luminárias, plaquinhas e decoração para quem leva o café a sério. Feito sob encomenda, pedido pelo WhatsApp.">
<meta name="theme-color" content="#2B1810">

<link rel="canonical" href="https://www.cafezim.store/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="cafezim">
<meta property="og:title" content="cafezim — peças para o seu cantinho do café">
<meta property="og:description" content="Bandejas, suportes, luminárias, plaquinhas e decoração para quem leva o café a sério.">
<meta property="og:image" content="https://www.cafezim.store/marca/logo-horizontal-2400.png">
<meta property="og:url" content="https://www.cafezim.store/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="marca/favicon.svg" type="image/svg+xml">
<link rel="icon" href="marca/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="marca/icone-app-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/estilo.css">

<!-- Catálogo carregado de forma bloqueante: quando a página pinta, os produtos já estão aqui.
     Nenhum fetch, nenhum spinner, nenhum salto de layout. Gerado de dados/catalogo.json. -->
<script src="dados/catalogo.js"></script>
</head>
<body>

<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="cabecalho">
  <div class="faixa">
    <button class="menu-botao" id="menu-botao" aria-expanded="false" aria-controls="menu">
      <span class="hamburguer" aria-hidden="true"></span>
      <span class="sr">Abrir categorias</span>
    </button>

    <a class="marca" href="#/" aria-label="cafezim — início">
      <img src="marca/logo-horizontal.svg" alt="cafezim" width="150" height="40">
    </a>

    <nav class="menu" id="menu" aria-label="Categorias">
      <a href="#/" data-nav="inicio">Início</a>
      <span class="menu-separador" aria-hidden="true"></span>
      <span id="menu-categorias" class="menu-grupo"></span>
    </nav>

    <button class="busca-abrir" id="busca-abrir" aria-expanded="false" aria-controls="busca" aria-label="Buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    </button>

    <a class="carrinho-abrir" id="carrinho-abrir" href="#/carrinho" aria-label="Ver carrinho">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span class="carrinho-contagem" id="carrinho-contagem" hidden>0</span>
    </a>

    <form class="busca" id="busca" role="search">
      <svg class="busca-lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input type="search" id="busca-campo" placeholder="Buscar peça…" aria-label="Buscar produto" autocomplete="off">
      <button class="busca-fechar" type="button" id="busca-fechar" aria-label="Fechar busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
  </div>
  <p class="tarja-topo" id="tarja-topo"></p>
</header>

<main id="conteudo" tabindex="-1"></main>

<footer class="rodape">
  <div class="rodape-interno">
    <img class="rodape-marca" src="marca/logo-fundo-escuro.svg" alt="cafezim" width="170" height="46">
    <p class="rodape-texto" id="rodape-texto"></p>
    <div class="rodape-links" id="rodape-links"></div>
    <p class="rodape-aviso" id="rodape-aviso"></p>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
